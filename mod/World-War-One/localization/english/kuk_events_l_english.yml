l_english:

 kuk_events.5.t:0 "The Separatists Have Broken Free !"
 kuk_events.5.d:0 "The various nations of our realm have declared independance ! The empire has collapsed !"
 kuk_events.5.f:0 "Taking advantage of the chaos faced by the central governement, the various nationalities of the empire have taken arms and claimed their respective territories. Due to the situation we are stuck with, we cannot restore order and face them. There is nothing left we can do !"
 kuk_events.5.a:0 "So it ends ..."

 kuk_events.6.t:0 "A New State"
 kuk_events.6.d:0 "Our union is now solid enough to transcend itself into a more inclusive regime. It's time to proclaim the Danubian Federation !"
 kuk_events.6.f:0 "By assuring order, creating a real democracy and legitimizing the idea of a broader union, we have now all the cards in our hands to reach the next step of the Austro-Hungarian union : a danubian federation that will politically include all the nationalities of our realm. By this process, we will make sure separatism will be an idea of the past. This will assure us a stable and more prosperous future, as we can advance into one direction together with confidence."
 kuk_events.6.a:0 "Long live the Federation !"
 kuk_events.6.b:0 "Only Austrians and Hungarians shall prevail !"

 je_fragile_union:0 "A Fragile Union"
 je_fragile_union_reason:0 "The union of 1867 has stabilized the Empire, but it remains composed of various nationalities which are demographically overwhelming us. Order is assured as long as our central state stands. The danger also lies abroad, as many rivals would like to see our empire collapse. To make sure it isn't even possible, we have to solidify the union by including those various nations into our political life. To achieve this, we will have democratize our regime, spread the idea of a broader union and make sure order is assured. When suceed, we can reform our state into a more inclusive and stable federation."
 je_fragile_union_desc:0 "The union of 1867 has stabilized the Empire, but it remains composed of various nationalities which are demographically overwhelming us. Order is assured as long as our central state stands. The danger also lies abroad, as many rivals would like to see our empire collapse. To make sure it isn't even possible, we have to solidify the union by including those various nations into our political life. To achieve this, we will have democratize our regime, spread the idea of a broader union and make sure order is assured. When suceed, we can reform our state into a more inclusive and stable federation."