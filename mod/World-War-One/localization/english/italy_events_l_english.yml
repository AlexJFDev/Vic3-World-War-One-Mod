l_english:

 je_fascist_threat:0 "Fascist Threat"
 je_fascist_threat_reason:0 "We are victorious, yet we have been stripped away from the territories promised by our allies. This mutilated victory has angered many in the nation, who feel like the consequent efforts demanded during the war has been done for nothing. In addition to this popular base advocating for irredentism, the elites fear the growing influence of socialsm locally and abroad. They are supporting the fascist movement to make sure those leftist ideologies are suppressed. We can also support the fascists, however the infuence of this new conservative movement could grow beyond our control, which could lead to uncertain consequences ..."
 je_fascist_threat_desc:0 "We are victorious, yet we have been stripped away from the territories promised by our allies. This mutilated victory has angered many in the nation, who feel like the consequent efforts demanded during the war has been done for nothing. In addition to this popular base advocating for irredentism, the elites fear the growing influence of socialsm locally and abroad. They are supporting the fascist movement to make sure those leftist ideologies are suppressed. We can also support the fascists, however the infuence of this new conservative movement could grow beyond our control, which could lead to uncertain consequences ..."
 je_fascist_threat_completion_desc:0 "Fascist will restrain from performing shows of force that could threathen our government."
 je_fascist_threat_failure_desc:0 "Fascist will start performing shows of force to threathen our government."

 italy_events.10.t:0 "The Rise of Fascism"
 italy_events.10.d:0 "A modern form of conservatism has arised, fascinating many in Italy and abroad. It could be usefull to counteract the leftist movements."
 italy_events.10.f:0 "Fascists agitators have gained a lot of tractions among intellectual fields for their advocation of fascism : a modern conservative ideology promoting traditionnal values and militarism. They particularly managed to gain the support of the population due to the humiliating peace deal we have been forced to accept recently. If let uncheck, they could soon become the most influencial political movement in Italy. Due to it's staunch opposition to socialism, this movement could be usefull to restore the balance in our political scene. However if we start supporting this movement, we dont know how far it can go."
 italy_events.10.a:0 "Let's fund this movement !"
 italy_events.10.b:0 "We must a close eye on this movement."

 italy_events.11.t:0 "The Fiume Question"
 italy_events.11.d:0 "Nationalist forces have illegally taken over Fiume, should we support them ?"
 italy_events.11.f:0 "Self-organized soldiers, frustrated by the peace treaty we had been granted by our allies, have started an illegal occupation of the foreign city of Fiume with the local Italian population's support. Although we cannot blame them, it would also be difficult to support them either, as this occupation is violating our neigbour sovereignty. However, if we accept the city's restitution, it will anger the nationalist movements and the army. What should we do ?"
 italy_events.11.a:0 "Good job !"
 italy_events.11.b:0 "We will not support nor repress the city state."
 italy_events.11.c:0 "We must give back Fiume."

 italy_events.12.t:0 "The Fiume Question"
 italy_events.12.d:0 "Italian nationalist forces have illegally taken over Fiume, should we retaliate ?"
 italy_events.12.f:0 "Self-organized soldiers, frustrated by the peace treaty Italy has been granted by our allies in our favor, have started an illegal occupation of our city of Fiume with the local Italian population's support. Although the Italian government pretends it did not order this occupation violating our sovereignty, they nonetheless did not condemn or punished the perpetrators. Our elites are getting impatient and demanding Fiume's return to restore our borders has they have been decided by the Treaty of Versailles. However, initiating an attack against the new city state could lead to another war, while our people has already suffered enough. What should we do ?"
 italy_events.12.a:0 "That's not worth another war."
 italy_events.12.b:0 "We will take by Fiume by force !"

 special_funding_1 "Special Funding Project"
 special_funding_1_desc:0 "This country is funding a project for a certain time."

 italy_events.13.t:0 "The March on [ROOT.GetCountry.GetCapital.GetCityHubName]"
 italy_events.13.d:0 "Fascists are showing their muscles and demanding positions in the government. Should we accept ?"
 italy_events.13.f:0 "The movement has organized a mass protests at the capital. We could try to restore order by declaring the state of siege and sending the police, or grant them power to conciliate them and cool down the situation. We must be ready to face their anger if refuse their demands. On the contrary, granting them positions in the government will surely lead to authoritarian measures than our regime may not be able to resist, but we will be assured to be definitly protected from leftist ideologies."
 italy_events.13.a:0 "Our regime shall embrace this ideology."
 italy_events.13.b:0 "Grant them positions in the government."
 italy_events.13.c:0 "Disperse the protest !"

 italy_events.15.t:0 "We Are Loosing The War !"
 italy_events.15.d:0 "Fascists are clinging on to a war we cannot win. It is time to put an end to this and take back Italy !"
 italy_events.15.f:0 "The fascists forces have dragged us into a world war we are now engufled into, with no progress in sight. We must admit this has gone too far, remove them from power and fight them. We will have the support of the allies, ready to deploy their forces in Italy. Although it will start a civil war, we will at least be on the victors' side, instead of commiting to a devastating defeat."
 italy_events.15.a:0 "We must fight the fascists and take back Italy !"
 italy_events.15.b:0 "We must continue the fight no matter what !"

 je_war_fatigue_italy:0 "War Fatigue"
 je_war_fatigue_italy_reason:0 "The fascists forces have dragged us into a world war we are now engufled into, with no proggres in sight. The italian people is now very septical of our capacity to emerge victorious. This is hurting our government and rallying lot of opposants. Our coalition needs to at least occupy one major enemy capital to inspire our people again. If we really cannot do so, then it is preferable to give up now."
