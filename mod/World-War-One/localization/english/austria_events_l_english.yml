l_english:

 austria_events.5.t:0 "The Separatists Have Break Free !"
 austria_events.5.d:0 "The various nations of our realm have declared independance ! The empire has collapsed !"
 austria_events.5.f:0 "Taking advantage of the chaos faced by the central governement, the various nationalities of the empire have taken arms and claimed their respective territories. Due to the situation we are stuck with, we cannot restore order and face them. There is nothing left we can do !"
 austria_events.5.a:0 "So it ends ..."

 je_fragile_union:0 "Fragile Union"
 je_fragile_union_reason:0 "The union of 1867 has stabilized the Empire, but it remains composed of various nationalities which are demographically overwhelming us. Order is assured as long as our central state stands. The danger lies abroad, as many rivals would like to see our empire collapse."
